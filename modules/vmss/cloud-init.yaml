#cloud-config
package_update: true
packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    content: |
      <html>
        <head><title>3-Tier Azure Demo</title></head>
        <body>
          <h1>Hello from $(hostname)</h1>
          <p>Served through Application Gateway + WAF from the private web/app subnet.</p>
        </body>
      </html>

runcmd:
  - sed -i "s/\$(hostname)/$(hostname)/" /var/www/html/index.html
  - systemctl enable nginx
  - systemctl restart nginx
